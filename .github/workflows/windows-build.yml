name: Shinra Core Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath 'shinra-core-windows.zip' `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: shinra-core-windows
          path: shinra-core-windows.zip
          retention-days: 7
