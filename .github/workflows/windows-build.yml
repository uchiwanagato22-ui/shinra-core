name: Shinra Core Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build Windows release
        shell: powershell
        run: |
          $env:CL = '/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'
          flutter build windows --release

      - name: Verify Windows build
        shell: powershell
        run: |
          if (-not (Test-Path 'build/windows/x64/runner/Release')) {
            Write-Error 'Windows release folder was not created.'
            exit 1
          }

          Write-Host 'Windows release successfully created.'
          Get-ChildItem 'build/windows/x64/runner/Release' -Recurse |
            Select-Object FullName, Length

      - name: Create ZIP
        shell: powershell
        run: |
          if (Test-Path 'shinra-core-windows.zip') {
            Remove-Item 'shinra-core-windows.zip' -Force
          }

          Compress-Archive `
            -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath 'shinra-core-windows.zip' `
            -Force

          Write-Host 'ZIP successfully created.'
          Get-Item 'shinra-core-windows.zip' |
            Select-Object FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: shinra-core-windows
          path: shinra-core-windows.zip
          retention-days: 7